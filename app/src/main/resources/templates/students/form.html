<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Student</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1 th:text="${student.id == null ? 'Add student' : 'Edit student'}"></h1><form th:action="@{/students}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><label>Name <input th:field="*{name}"></label><small th:errors="*{name}"></small><label>Email <input th:field="*{email}"></label><small th:errors="*{email}"></small><label>Course <input th:field="*{course}"></label><small th:errors="*{course}"></small><label>Graduation year <input type="number" th:field="*{graduationYear}"></label><small th:errors="*{graduationYear}"></small><button>Save</button> <a href="/students">Cancel</a></form></main></body></html>
