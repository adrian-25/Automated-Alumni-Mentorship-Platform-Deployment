<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student profile · Mentorship</title><link rel="stylesheet" th:href="@{/css/app.css(v=20261018)}"></head>
<body>
<header class="site-header"><div class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">AM</span> Alumni Mentorship</a><nav class="primary-nav" aria-label="Primary navigation"><a th:href="@{/}">Dashboard</a><a th:href="@{/alumni}">Alumni</a><a th:href="@{/students}" aria-current="page">Students</a><a th:href="@{/requests}">Requests</a><a th:href="@{/about}">About</a></nav></div></header>
<main><header class="page-heading"><div><p class="eyebrow">Student profile</p><h1 th:text="${student.id == null ? 'Add a student' : 'Edit student profile'}">Add a student</h1><p class="lede">Create a profile that can be matched with an alumni mentor.</p></div></header><section class="panel form-panel"><div class="panel-body"><form th:action="@{/students}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><label><span class="field-label">Full name</span><input th:field="*{name}" autocomplete="name" placeholder="e.g. Rohan Mehta"><small th:errors="*{name}"></small></label><label><span class="field-label">Email address</span><input th:field="*{email}" type="email" autocomplete="email" placeholder="name@example.com"><small th:errors="*{email}"></small></label><label><span class="field-label">Course</span><input th:field="*{course}" placeholder="e.g. Computer Science"><small th:errors="*{course}"></small></label><label><span class="field-label">Graduation year</span><input th:field="*{graduationYear}" type="number" min="1900" max="2100" placeholder="2027"><small th:errors="*{graduationYear}"></small></label></div><div class="form-actions"><button type="submit">Save student</button><a class="button button-secondary" th:href="@{/students}">Cancel</a></div></form></div></section></main>
</body></html>
