<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Students</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav><a href="/alumni">Alumni</a> <a href="/students">Students</a> <a href="/requests">Requests</a> <a href="/">Dashboard</a></nav><main><h1>Students</h1><a class="button" href="/students/new">Add student</a><form method="get"><label>Search name or course <input name="query" th:value="${query}"></label><button>Search</button></form><table><thead><tr><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th>Action</th></tr></thead><tbody><tr th:each="person : ${students}"><td th:text="${person.name}"></td><td th:text="${person.email}"></td><td th:text="${person.course}"></td><td th:text="${person.graduationYear}"></td><td><a th:href="@{/students/{id}/edit(id=${person.id})}">Edit</a></td></tr></tbody></table></main></body></html>
