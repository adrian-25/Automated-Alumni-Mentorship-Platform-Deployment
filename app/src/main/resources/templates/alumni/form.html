<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alumnus profile · Mentorship</title><link rel="stylesheet" th:href="@{/css/app.css(v=20261018)}"></head>
<body>
<header class="site-header"><div class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">AM</span> Alumni Mentorship</a><nav class="primary-nav" aria-label="Primary navigation"><a th:href="@{/}">Dashboard</a><a th:href="@{/alumni}" aria-current="page">Alumni</a><a th:href="@{/students}">Students</a><a th:href="@{/requests}">Requests</a></nav></div></header>
<main><header class="page-heading"><div><p class="eyebrow">Mentor profile</p><h1 th:text="${alumnus.id == null ? 'Add an alumnus' : 'Edit alumnus profile'}">Add an alumnus</h1><p class="lede">Capture the information students need to find the right mentor.</p></div></header><section class="panel form-panel"><div class="panel-body"><form th:action="@{/alumni}" th:object="${alumnus}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><label><span class="field-label">Full name</span><input th:field="*{name}" autocomplete="name" placeholder="e.g. Aisha Patel"><small th:errors="*{name}"></small></label><label><span class="field-label">Email address</span><input th:field="*{email}" type="email" autocomplete="email" placeholder="name@example.com"><small th:errors="*{email}"></small></label><label><span class="field-label">Company</span><input th:field="*{company}" autocomplete="organization" placeholder="e.g. Northstar Systems"><small th:errors="*{company}"></small></label><label><span class="field-label">Expertise</span><input th:field="*{expertise}" placeholder="e.g. Cloud architecture"><small th:errors="*{expertise}"></small></label><label><span class="field-label">Graduation year</span><input th:field="*{graduationYear}" type="number" min="1900" max="2100" placeholder="2020"><small th:errors="*{graduationYear}"></small></label></div><div class="form-actions"><button type="submit">Save alumnus</button><a class="button button-secondary" th:href="@{/alumni}">Cancel</a></div></form></div></section></main>
</body></html>
