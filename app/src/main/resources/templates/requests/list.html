<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Mentorship requests</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav><a href="/alumni">Alumni</a> <a href="/students">Students</a> <a href="/requests">Requests</a> <a href="/">Dashboard</a></nav><main><h1>Mentorship requests</h1><p th:if="${error}" th:text="${error}"></p><a class="button" href="/requests/new">New request</a><table><thead><tr><th>Student</th><th>Alumnus</th><th>Message</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="request : ${requests}"><td th:text="${request.student.name}"></td><td th:text="${request.alumni.name}"></td><td th:text="${request.message}"></td><td th:text="${request.status}"></td><td><form th:action="@{/requests/{id}/status(id=${request.id})}" method="post"><select name="role"><option value="ALUMNI">Alumni</option><option value="ADMIN">Admin</option></select><select name="status"><option value="ACCEPTED">Accept</option><option value="REJECTED">Reject</option><option value="COMPLETED">Complete</option></select><button>Update</button></form></td></tr></tbody></table></main></body></html>
