<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit request · Mentorship</title><link rel="stylesheet" th:href="@{/css/app.css(v=20261018)}"></head>
<body>
<header class="site-header"><div class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">AM</span> Alumni Mentorship</a><nav class="primary-nav" aria-label="Primary navigation"><a th:href="@{/}">Dashboard</a><a th:href="@{/alumni}">Alumni</a><a th:href="@{/students}">Students</a><a th:href="@{/requests}" aria-current="page">Requests</a><a th:href="@{/about}">About</a></nav></div></header>
<main><header class="page-heading"><div><p class="eyebrow">Flexible pairing</p><h1>Edit mentorship request</h1><p class="lede">Change the student, alumni mentor, or request message at any time. The current workflow status is kept intact.</p></div></header><section class="panel form-panel"><div class="panel-body"><form th:action="@{/requests/{id}(id=${request.id})}" method="post"><div class="form-grid"><label><span class="field-label">Student</span><select name="studentId" required><option th:each="student : ${students}" th:value="${student.id}" th:selected="${student.id == request.student.id}" th:text="${student.name}">Student</option></select></label><label><span class="field-label">Alumni mentor</span><select name="alumniId" required><option th:each="person : ${alumni}" th:value="${person.id}" th:selected="${person.id == request.alumni.id}" th:text="${person.name}">Alumnus</option></select></label><label class="full-width"><span class="field-label">Request message</span><textarea name="message" required th:text="${request.message}">Message</textarea><span class="hint">Current status: <strong th:text="${request.status}">REQUESTED</strong></span></label></div><div class="form-actions"><button type="submit">Save changes</button><a class="button button-secondary" th:href="@{/requests}">Cancel</a></div></form></div></section></main>
</body></html>
