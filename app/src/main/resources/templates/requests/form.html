<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New request · Mentorship</title><link rel="stylesheet" th:href="@{/css/app.css(v=20261018)}"></head>
<body>
<header class="site-header"><div class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">AM</span> Alumni Mentorship</a><nav class="primary-nav" aria-label="Primary navigation"><a th:href="@{/}">Dashboard</a><a th:href="@{/alumni}">Alumni</a><a th:href="@{/students}">Students</a><a th:href="@{/requests}" aria-current="page">Requests</a></nav></div></header>
<main><header class="page-heading"><div><p class="eyebrow">Connection workflow</p><h1>New mentorship request</h1><p class="lede">Select a student and mentor, then add a clear note about what support is needed.</p></div></header><section class="panel form-panel"><div class="panel-body"><p class="notice" th:if="${#lists.isEmpty(students) or #lists.isEmpty(alumni)}">Create at least one student and one alumnus before sending a request.</p><form th:action="@{/requests}" method="post"><div class="form-grid"><label><span class="field-label">Student</span><select name="studentId" required><option value="" disabled selected>Select a student</option><option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name}">Student</option></select></label><label><span class="field-label">Alumni mentor</span><select name="alumniId" required><option value="" disabled selected>Select an alumnus</option><option th:each="person : ${alumni}" th:value="${person.id}" th:text="${person.name}">Alumnus</option></select></label><label class="full-width"><span class="field-label">Request message</span><textarea name="message" required placeholder="Describe the topic, goal, or guidance the student is seeking."></textarea><span class="hint">Keep it specific so the mentor can respond productively.</span></label></div><div class="form-actions"><button type="submit">Create request</button><a class="button button-secondary" th:href="@{/requests}">Cancel</a></div></form></div></section></main>
</body></html>
