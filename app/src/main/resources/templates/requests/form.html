<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>New request</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>New mentorship request</h1><p th:if="${#lists.isEmpty(students) or #lists.isEmpty(alumni)}">Create at least one student and one alumnus first.</p><form method="post" action="/requests"><label>Student <select name="studentId"><option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name}"></option></select></label><label>Alumnus <select name="alumniId"><option th:each="person : ${alumni}" th:value="${person.id}" th:text="${person.name}"></option></select></label><label>Message <textarea name="message" required></textarea></label><button>Create request</button> <a href="/requests">Cancel</a></form></main></body></html>
